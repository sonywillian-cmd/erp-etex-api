# nginx — instancia ${INSTANCIA} · ${DOMINIO} (generado por crear-instancia.sh)
# Enruta por dominio: /api/v1 → API, /uploads → archivos de la instancia, el resto → Next.
# SSL: certbot --nginx -d ${DOMINIO} (o certificado comodín *.etex360.com)
server {
    listen 80;
    server_name ${DOMINIO};
    client_max_body_size 25m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:${PUERTO_API}/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias ${DIR_INSTANCIA}/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:${PUERTO_FRONT};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
